name: Update Law Query Data

on:
  schedule:
    - cron: '30 22 * * *' # 每天 UTC 22:30 (北京时间次日 6:30) 运行
  workflow_dispatch:      # 允许手动触发
    inputs:
      keyword:
        description: '检索关键词（留空则依次检索所有默认关键词）'
        required: false
        default: ''
      source:
        description: '数据来源：mcp=北大法宝 MCP 服务（失败时回退浏览器）；browser=模拟浏览器'
        required: false
        default: 'mcp'
        type: choice
        options:
          - mcp
          - browser
      enrich_existing:
        description: '仅补全已有条目的制定机关/效力位阶（不执行新搜索，true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PKULAW_MCP_TOKEN: ${{ secrets.PKULAW_MCP_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install --with-deps chromium

      - name: Run query script
        run: |
          ENRICH="${{ inputs.enrich_existing }}"
          echo "Enrich existing: $ENRICH"

          if [ "$ENRICH" = "true" ]; then
            # 仅补全已有条目的详情信息，不执行新搜索
            python query.py --enrich-existing --out "法规.csv"
          else
            # 数据来源：定时触发默认 mcp（MCP 优先）；手动触发可用 source 输入覆盖
            SOURCE="${{ inputs.source || 'mcp' }}"
            echo "Source: $SOURCE"

            # 关键词按数据源分组；手动输入优先，并同时作为故障回退关键词
            KEYWORD_INPUT="${{ inputs.keyword }}"
            if [ -n "$KEYWORD_INPUT" ]; then
              KEYWORDS=("$KEYWORD_INPUT")
              BROWSER_KEYWORDS=("$KEYWORD_INPUT")
            else
              mapfile -t KEYWORDS < <(python -c 'import sys; from query import load_keywords; print("\n".join(load_keywords(sys.argv[1])))' "$SOURCE")
              mapfile -t BROWSER_KEYWORDS < <(python -c 'from query import load_keywords; print("\n".join(load_keywords("browser")))')
            fi
            if [ "${#KEYWORDS[@]}" -eq 0 ] || [ "${#BROWSER_KEYWORDS[@]}" -eq 0 ]; then
              echo "::error::关键词配置为空或读取失败"
              exit 1
            fi

            # 积分节省策略：每日仅增量扫最近 5 天；每周一全月复核
            DAYS_FLAG="--days 5"
            if [ "$(date +%u)" = "1" ]; then
              DAYS_FLAG=""
              echo "周一：全月复核（不使用增量窗口）"
            fi

            if [ "$SOURCE" = "mcp" ]; then
              BROWSER_FALLBACK=false
              for KW in "${KEYWORDS[@]}"; do
                echo "=========================================="
                echo "正在通过 MCP 查询关键词: $KW"
                echo "=========================================="
                rc=0
                python query.py --source mcp --keyword "$KW" --out "法规_mcp.jsonl" $DAYS_FLAG || rc=$?
                if [ $rc -eq 2 ]; then
                  echo "::warning::MCP 当日不可用，停止剩余 MCP 关键词"
                  BROWSER_FALLBACK=true
                  break
                elif [ $rc -ne 0 ]; then
                  echo "::warning::MCP 临时故障，关键词 $KW 将在浏览器小组中回退"
                  BROWSER_FALLBACK=true
                fi
              done
              if [ "$BROWSER_FALLBACK" = "true" ]; then
                echo "开始使用浏览器小组关键词回退抓取"
                for KW in "${BROWSER_KEYWORDS[@]}"; do
                  python query.py --keyword "$KW" --out "法规.csv"
                done
              fi
            else
              for KW in "${KEYWORDS[@]}"; do
                echo "=========================================="
                echo "正在通过浏览器查询关键词: $KW"
                echo "=========================================="
                python query.py --keyword "$KW" --out "法规.csv"
              done
            fi
          fi
          
      - name: Generate Update Time
        run: |
          # 生成 meta.json 包含北京时间
          python -c "import json; from datetime import datetime, timedelta, timezone; tz = timezone(timedelta(hours=8)); now = datetime.now(tz).strftime('%Y-%m-%d %H:%M'); print(json.dumps({'updated_at': now}, ensure_ascii=False))" > meta.json

      - name: Generate RSS Feed
        run: |
          python generate_rss.py

      - name: Commit and push changes
        run: |
          git config --local user.email "youngfish42@users.noreply.github.com"
          git config --local user.name "youngfish42"
          git add 法规.csv meta.json feed.xml
          # MCP 原始 JSONL 输出与覆盖账本（browser 模式或未跑 MCP 时可能不存在）
          if [ -f "法规_mcp.jsonl" ]; then git add "法规_mcp.jsonl"; fi
          if [ -f "mcp_backfill_state.json" ]; then git add "mcp_backfill_state.json"; fi
          
          # Check for staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update law data and timestamp"
            git push
          fi
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: query-results
          path: |
            法规.csv
            法规_mcp.jsonl
            meta.json
            feed.xml
