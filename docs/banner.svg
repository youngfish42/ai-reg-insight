<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>

  <!-- 雷达/瞭望 LOGO -->
  <g transform="translate(150,150)">
    <circle r="95" fill="none" stroke="#4fd1c5" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="65" fill="none" stroke="#4fd1c5" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="35" fill="none" stroke="#4fd1c5" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#4fd1c5" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#4fd1c5" stroke-opacity="0.15" stroke-width="1"/>
    <path d="M 0 0 L 67 -67 A 95 95 0 0 0 -20 -93 Z" fill="url(#beam)"/>
    <line x1="0" y1="0" x2="67" y2="-67" stroke="#4fd1c5" stroke-width="2"/>
    <circle r="6" fill="#4fd1c5"/>
    <circle cx="30" cy="-42" r="4" fill="#f6e05e"/>
    <circle cx="-48" cy="20" r="4" fill="#f6e05e"/>
    <circle cx="18" cy="55" r="4" fill="#f6e05e"/>
    <circle cx="-25" cy="-60" r="3" fill="#90cdf4"/>
  </g>

  <!-- 项目名 -->
  <text x="300" y="135" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="52" font-weight="700" fill="#ffffff">AI 法规瞭望</text>
  <text x="302" y="175" font-family="'Segoe UI',sans-serif" font-size="22" letter-spacing="4" fill="#4fd1c5">AI REG INSIGHT</text>
  <text x="302" y="212" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="17" fill="#cbd5e0">追踪 · 调研 · 展示人工智能领域相关法规信息</text>

  <!-- 右侧装饰：法规文书卡片层叠 -->
  <g transform="translate(840,150)">
    <g transform="rotate(10)">
      <rect x="-70" y="-92" width="140" height="184" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#4fd1c5" stroke-opacity="0.25" stroke-width="1.5"/>
    </g>
    <g transform="rotate(2)">
      <rect x="-70" y="-92" width="140" height="184" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#4fd1c5" stroke-opacity="0.4" stroke-width="1.5"/>
      <line x1="-48" y1="-66" x2="20" y2="-66" stroke="#4fd1c5" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
      <line x1="-48" y1="-38" x2="48" y2="-38" stroke="#cbd5e0" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>
      <line x1="-48" y1="-16" x2="48" y2="-16" stroke="#cbd5e0" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>
      <line x1="-48" y1="6" x2="28" y2="6" stroke="#cbd5e0" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>
      <line x1="-48" y1="28" x2="48" y2="28" stroke="#cbd5e0" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>
      <line x1="-48" y1="50" x2="8" y2="50" stroke="#cbd5e0" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>
      <circle cx="38" cy="66" r="9" fill="none" stroke="#f6e05e" stroke-opacity="0.7" stroke-width="2"/>
    </g>
    <circle cx="-95" cy="-105" r="3" fill="#4fd1c5" fill-opacity="0.5"/>
    <circle cx="95" cy="-80" r="2.5" fill="#f6e05e" fill-opacity="0.6"/>
    <circle cx="80" cy="105" r="3" fill="#90cdf4" fill-opacity="0.5"/>
  </g>
</svg>
