<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>

  <!-- 背景质感：右侧极淡的雷达波纹 -->
  <g transform="translate(975,150)" fill="none" stroke="#4fd1c5">
    <circle r="90" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle r="160" stroke-opacity="0.07" stroke-width="1.5"/>
    <circle r="230" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle r="300" stroke-opacity="0.035" stroke-width="1.5"/>
  </g>

  <!-- LOGO + 字标 lockup，整体水平居中 -->
  <g transform="translate(245,150)">
    <circle r="72" fill="none" stroke="#4fd1c5" stroke-opacity="0.35" stroke-width="2.5"/>
    <circle r="48" fill="none" stroke="#4fd1c5" stroke-opacity="0.5" stroke-width="2.5"/>
    <circle r="24" fill="none" stroke="#4fd1c5" stroke-opacity="0.7" stroke-width="2.5"/>
    <line x1="-72" y1="0" x2="72" y2="0" stroke="#4fd1c5" stroke-opacity="0.18" stroke-width="1.5"/>
    <line x1="0" y1="-72" x2="0" y2="72" stroke="#4fd1c5" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M 0 0 L 51 -51 A 72 72 0 0 0 -15 -70 Z" fill="url(#beam)"/>
    <line x1="0" y1="0" x2="51" y2="-51" stroke="#4fd1c5" stroke-width="2.5"/>
    <circle r="5.5" fill="#4fd1c5"/>
    <circle cx="23" cy="-32" r="4" fill="#f6e05e"/>
    <circle cx="-37" cy="15" r="4" fill="#f6e05e"/>
    <circle cx="14" cy="42" r="4" fill="#f6e05e"/>
  </g>

  <text x="365" y="148" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" fill="#ffffff">AI 法规瞭望</text>
  <text x="367" y="192" font-family="'Segoe UI',sans-serif" font-size="20" letter-spacing="6" fill="#4fd1c5">AI REG INSIGHT</text>
  <line x1="367" y1="212" x2="727" y2="212" stroke="#4fd1c5" stroke-opacity="0.35" stroke-width="1"/>
  <text x="367" y="240" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#a0aec0">追踪 · 调研 · 展示人工智能领域相关法规信息</text>
</svg>
